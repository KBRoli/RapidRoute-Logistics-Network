<IfModule mod_ssl.c>
    <VirtualHost *:443>
        ServerName www.rapidroute.local
        ServerAlias rr-web01.rapidroute.local
        ServerAdmin administrator@rapidroute.local

        DocumentRoot /var/www/rapidroute

        <Directory /var/www/rapidroute>
            Options -Indexes +FollowSymLinks
            AllowOverride None
            Require all granted
        </Directory>

        SSLEngine on
        SSLCertificateFile /etc/ssl/certs/rapidroute.crt
        SSLCertificateKeyFile /etc/ssl/private/rapidroute.key
        SSLProtocol -all +TLSv1.2 +TLSv1.3
        SSLCipherSuite HIGH:!aNULL:!MD5

        ErrorLog ${APACHE_LOG_DIR}/rapidroute_ssl_error.log
        CustomLog ${APACHE_LOG_DIR}/rapidroute_ssl_access.log combined
    </VirtualHost>
</IfModule>
