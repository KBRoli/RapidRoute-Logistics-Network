<VirtualHost *:80>
    ServerName www.rapidroute.local
    ServerAlias rr-web01.rapidroute.local
    ServerAdmin administrator@rapidroute.local

    DocumentRoot /var/www/rapidroute

    <Directory /var/www/rapidroute>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/rapidroute_error.log
    CustomLog ${APACHE_LOG_DIR}/rapidroute_access.log combined
</VirtualHost>
